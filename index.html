<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Client Showcase</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
  }
  .card {
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 24px;
    padding: 48px 40px;
    max-width: 480px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,0.3);
  }
  h1 { font-size: 32px; margin-bottom: 12px; letter-spacing: 1px; }
  p { font-size: 16px; opacity: 0.95; line-height: 1.6; margin-bottom: 24px; }
  .badge {
    display: inline-block;
    padding: 6px 16px;
    border-radius: 20px;
    background: rgba(255,255,255,0.2);
    border: 1px solid rgba(255,255,255,0.3);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 16px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="badge">Prepared for your client</div>
    <h1>Hello from Sweet Kinky Feet</h1>
    <p>This is your live showcase page — ready to share with your client. Built and deployed straight from the SKF empire.</p>
  </div>
</body>
</html>
